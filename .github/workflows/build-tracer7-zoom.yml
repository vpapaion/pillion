name: Build Pillion Zoom Focus APK

on:
  workflow_dispatch:
  push:
    branches:
      - agent/tracer7-display-zoom
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Apply pending focus feature source patch
        run: |
          if [ -f .github/focus-feature-source.patch.gz ]; then
            gzip -dc .github/focus-feature-source.patch.gz | git apply --check
            gzip -dc .github/focus-feature-source.patch.gz | git apply
            rm .github/focus-feature-source.patch.gz
            rm -f .github/build-tracer7-zoom.final.yml
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: |
          chmod +x gradlew
          ./gradlew --stacktrace :composeApp:testDebugUnitTest :composeApp:assembleDebug

      - name: Publish verified source changes
        run: |
          if ! git diff --quiet || [ -n "$(git ls-files --others --exclude-standard)" ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -A
            git diff --cached --check
            git commit -m 'feat(android): add selectable dashboard focus area [skip ci]'
            git push origin HEAD:${{ github.head_ref || github.ref_name }}
          fi

      - name: Name APK
        run: cp composeApp/build/outputs/apk/debug/composeApp-debug.apk Pillion-Zoom-Tracer7-Focus.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Pillion-Zoom-Tracer7-Focus
          path: Pillion-Zoom-Tracer7-Focus.apk
          if-no-files-found: error
          retention-days: 30
