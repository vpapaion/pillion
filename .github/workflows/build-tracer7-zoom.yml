name: Build Pillion Zoom APK
on:
  workflow_dispatch:
  push:
    branches: [agent/tracer7-display-zoom]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew && ./gradlew :composeApp:testDebugUnitTest :composeApp:assembleDebug
      - run: cp composeApp/build/outputs/apk/debug/composeApp-debug.apk Pillion-Zoom-Tracer7.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Pillion-Zoom-Tracer7
          path: Pillion-Zoom-Tracer7.apk
