name: Export Pillion Zoom source

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Pack source
        run: tar --exclude=.git -czf /tmp/Pillion-Zoom-current-source.tar.gz .

      - name: Upload source
        uses: actions/upload-artifact@v4
        with:
          name: Pillion-Zoom-current-source
          path: /tmp/Pillion-Zoom-current-source.tar.gz
          if-no-files-found: error
          retention-days: 2
