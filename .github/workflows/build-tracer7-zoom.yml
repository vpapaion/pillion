name: Build Pillion Bluetooth Screen-Off APK

on:
  workflow_dispatch:
  push:
    branches:
      - agent/tracer7-display-zoom
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: |
          chmod +x gradlew
          ./gradlew --stacktrace :composeApp:testDebugUnitTest :composeApp:assembleDebug

      - name: Name APK
        run: cp composeApp/build/outputs/apk/debug/composeApp-debug.apk Pillion-Zoom-Tracer7-Screen-Off.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Pillion-Zoom-Tracer7-Screen-Off
          path: Pillion-Zoom-Tracer7-Screen-Off.apk
          if-no-files-found: error
          retention-days: 30
